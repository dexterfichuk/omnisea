[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnisea"
version = "0.1.0"
description = "A unified Python client for ocean, tidal, and weather data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "omnisea contributors" }]
keywords = ["ocean", "oceanography", "tides", "weather", "xarray", "CF", "EDR"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "xarray>=2024.10",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Each of these is reachable: using the feature without its extra raises a
# MissingDependencyError naming the extra. `erddap`, `cmems` and `stac` used to be declared
# here and were removed before release — erddapy is deliberately unused (see
# providers/erddap/__init__.py), and the other two were for providers that do not exist yet.
cache  = ["requests-cache>=1.2"]        # omnisea.enable_cache()
netcdf = ["netCDF4>=1.6"]               # omnisea.to_netcdf(), and ERDDAP griddap over OPeNDAP
cioos  = ["PyYAML>=6.0"]                # CIOOS metadata-xml records are YAML
examples = ["matplotlib>=3.8", "jupyter>=1.0", "scikit-learn>=1.4", "statsmodels>=0.14"]  # examples/bamfield.ipynb
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "netCDF4>=1.6",
  "PyYAML>=6.0",
  "requests-cache>=1.2",  # so tests/test_http_cache.py exercises the cache, not just its absence
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/dexterfichuk/omnisea"

[tool.hatch.build.targets.wheel]
packages = ["src/omnisea"]

# py.typed tells mypy/pyright the annotations are real; the CF table ships as package data.
[tool.hatch.build.targets.wheel.force-include]
"src/omnisea/py.typed" = "omnisea/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: hits live upstream APIs (deselect with -m 'not network')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Executed notebooks carry rendered output; lint the sources they were built from instead.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
