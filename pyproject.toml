[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnisea"
version = "0.1.0"
description = "A unified Python client for ocean, tidal, and weather data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "omnisea contributors" }]
keywords = ["ocean", "oceanography", "tides", "weather", "xarray", "CF", "EDR"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "xarray>=2024.10",
  "numpy>=1.26",
]

[project.optional-dependencies]
erddap = ["erddapy>=2.2"]
cmems  = ["copernicusmarine>=1.3"]
stac   = ["pystac-client>=0.8"]
cache  = ["requests-cache>=1.2"]
cioos  = ["PyYAML>=6.0"]  # metadata-xml records are YAML
examples = ["matplotlib>=3.8", "jupyter>=1.0"]  # to run examples/bamfield.ipynb
netcdf = ["netCDF4>=1.6"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "netCDF4>=1.6",
  "PyYAML>=6.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/omnisea/omnisea"

[tool.hatch.build.targets.wheel]
packages = ["src/omnisea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: hits live upstream APIs (deselect with -m 'not network')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Executed notebooks carry rendered output; lint the sources they were built from instead.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
