# Publishes to PyPI on a version tag, via trusted publishing — no API token stored anywhere.
#
# Inert until two things happen, both on the PyPI side and both the maintainer's to do:
#   1. create the `omnisea` project on PyPI (or reserve it at first publish), and
#   2. add a trusted publisher: repository `dexterfichuk/omnisea`, workflow `release.yml`,
#      environment `pypi` (https://docs.pypi.org/trusted-publishers/).
# Then `git tag v0.1.0 && git push --tags` releases whatever the tag points at.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: The tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: PyPI trusts the workflow, not a stored secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
